<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV Dashboard</title>
<meta name="viewport" content="width=1920, initial-scale=1">
<style>
  /*
    Every size below is marked !important on purpose.
    TizenPortal's "Text Scale" feature (on by default, level "medium") injects
      div, span, p, ... { font-size: 1rem !important; line-height: ~1.46 !important }
    after the page loads, which shrank the clock/temperature. ID/class selectors
    with !important outrank its plain element selectors, so these always win.
  */
  :root { --bg:#0b0f17; --card:#131a26; --line:#212c3d; --text:#eef2f8; --dim:#8b98ad; --ice:#cfe3ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; background:var(--bg); color:var(--text);
    font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; overflow:hidden; }

  /* Fixed 1920x1080 canvas, scaled to the real screen width by fit() */
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; }
  /* 5% overscan-safe margins */
  .wrap { position:absolute; top:54px; right:96px; bottom:54px; left:96px; display:grid;
    grid-template-columns: 1.1fr 1fr; grid-template-rows: auto 1fr auto; gap:32px; }
  .wrap div { line-height:1.25 !important; letter-spacing:normal !important; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:28px; padding:36px 44px; }
  .label { font-size:22px !important; letter-spacing:.14em !important; text-transform:uppercase; color:var(--dim); margin-bottom:18px; }

  header { grid-column:1 / 3; grid-row:1; display:flex; justify-content:space-between; align-items:flex-end; }
  #time { font-size:150px !important; font-weight:200; line-height:1 !important; letter-spacing:-.02em !important; }
  #time small { font-size:48px !important; color:var(--dim); margin-left:14px; font-weight:300; }
  #date { font-size:38px !important; color:var(--dim); text-align:right; padding-bottom:14px; }
  #date b { display:block; color:var(--text); font-weight:400; font-size:44px !important; }

  #chart   { grid-column:1; grid-row:2; min-height:0; padding:0; overflow:hidden; }
  #chart .tradingview-widget-container { width:100%; height:100%; }
  #weather { grid-column:2; grid-row:2; min-height:0; display:flex; flex-direction:column; }

  .now { display:flex; align-items:center; gap:36px; }
  #wIcon { width:130px; height:130px; color:var(--ice); flex:none; }
  #wIcon svg { width:130px; height:130px; display:block; }
  #wTemp { font-size:120px !important; font-weight:200; line-height:1 !important; }
  #wDesc { font-size:36px !important; color:var(--text); margin-top:6px; }
  #wMeta, #wWind { font-size:26px !important; color:var(--dim); margin-top:4px; white-space:nowrap; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:34px; }
  .stat { border-top:1px solid var(--line); padding-top:16px; }
  .stat .k { font-size:18px !important; letter-spacing:.12em !important; text-transform:uppercase; color:var(--dim); }
  .stat .v { font-size:32px !important; margin-top:6px; white-space:nowrap; }

  .days { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-top:auto; }
  .day { background:#0f1520; border:1px solid var(--line); border-radius:20px; padding:22px 8px; text-align:center; }
  .day .d { font-size:24px !important; color:var(--dim); }
  .day .i { margin:10px 0; height:58px; display:flex; justify-content:center; color:var(--ice); }
  .day .i svg { width:58px; height:58px; display:block; }
  .day .t { font-size:28px !important; }
  .day .t span { font-size:inherit !important; letter-spacing:normal !important; color:var(--dim); }

  footer { grid-column:1 / 3; grid-row:3; overflow:hidden; border-radius:20px; border:1px solid var(--line); height:92px; background:var(--card); }
</style>
</head>
<body>
<div id="stage"><div class="wrap">
  <header>
    <div id="time">--:--<small></small></div>
    <div id="date"><b>--</b></div>
  </header>

  <section class="card" id="chart"></section>

  <section class="card" id="weather">
    <div class="label" id="wPlace">Weather</div>
    <div class="now">
      <div id="wIcon"></div>
      <div id="wTemp">--°</div>
      <div><div id="wDesc">Loading…</div><div id="wMeta"></div><div id="wWind" class="wmeta2"></div></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">High / Low</div><div class="v" id="sHL">–</div></div>
      <div class="stat"><div class="k">Precip</div><div class="v" id="sPop">–</div></div>
      <div class="stat"><div class="k">Sunrise</div><div class="v" id="sRise">–</div></div>
      <div class="stat"><div class="k">Sunset</div><div class="v" id="sSet">–</div></div>
    </div>
    <div class="days" id="days"></div>
  </section>

  <footer id="ticker"></footer>
</div></div>

<script>
/* ========= EDIT ME ========= */
var CONFIG = {
  place: "East Grand Forks, MN",
  lat: 47.93, lon: -97.02,
  timezone: "America/Chicago",
  hour12: true,
  units: "fahrenheit",            // "fahrenheit" or "celsius"
  chartSymbol: "AMEX:SPY",        // main chart
  tickers: [                      // scrolling tape (TradingView symbols)
    {proName:"AMEX:SPY", title:"S&P 500"}, {proName:"NASDAQ:QQQ", title:"Nasdaq 100"},
    {proName:"AMEX:DIA", title:"Dow"}, {proName:"AMEX:IWM", title:"Russell 2000"},
    {proName:"TVC:VIX", title:"VIX"}, {proName:"TVC:US10Y", title:"10Y Yield"},
    {proName:"NASDAQ:AAPL", title:"Apple"}, {proName:"NASDAQ:NVDA", title:"Nvidia"},
    {proName:"NASDAQ:MSFT", title:"Microsoft"}, {proName:"BITSTAMP:BTCUSD", title:"Bitcoin"}
  ],
  weatherRefreshMin: 15
};
/* =========================== */

function $(id){ return document.getElementById(id); }

/* ---- scale the 1920x1080 canvas by screen WIDTH only.
   The TV briefly reports a bogus viewport height (seen: 568px), so height is ignored. ---- */
function fit(){
  var w = window.innerWidth || 1920;
  var s = w / 1920;
  var st = $("stage");
  st.style.transform = "scale(" + s + ")";
  st.style.left = "0px";
  st.style.top = "0px";
}
fit();
window.addEventListener("resize", fit);
window.addEventListener("load", fit);
setInterval(fit, 5000);

/* ---- clock ---- */
function tick(){
  var now = new Date();
  var t = now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:CONFIG.hour12,timeZone:CONFIG.timezone});
  var parts = t.split(/\s+/);   // newer browsers put a narrow no-break space before AM/PM
  $("time").innerHTML = parts[0] + (parts[1] ? "<small>"+parts[1]+"</small>" : "");
  $("date").innerHTML = "<b>"+now.toLocaleDateString("en-US",{weekday:"long",timeZone:CONFIG.timezone})+"</b>" +
    now.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric",timeZone:CONFIG.timezone});
}
tick(); setInterval(tick, 1000);

/* ---- weather (Open-Meteo, no API key) ---- */
var WX = {0:["Clear","sun"],1:["Mostly clear","sun"],2:["Partly cloudy","part"],3:["Overcast","cloud"],
  45:["Fog","fog"],48:["Fog","fog"],51:["Light drizzle","rain"],53:["Drizzle","rain"],55:["Drizzle","rain"],
  61:["Light rain","rain"],63:["Rain","rain"],65:["Heavy rain","rain"],66:["Freezing rain","rain"],67:["Freezing rain","rain"],
  71:["Light snow","snow"],73:["Snow","snow"],75:["Heavy snow","snow"],77:["Snow grains","snow"],
  80:["Showers","rain"],81:["Showers","rain"],82:["Heavy showers","storm"],85:["Snow showers","snow"],86:["Snow showers","snow"],
  95:["Thunderstorm","storm"],96:["Thunderstorm","storm"],99:["Thunderstorm","storm"]};
var CLOUD = '<path d="M17 38h26a9 9 0 0 0 1-17.9A12 12 0 0 0 21 23a8 8 0 0 0-4 15z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>';
var SUN = '<circle cx="32" cy="32" r="9" fill="none" stroke="currentColor" stroke-width="3"/><g stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M32 10v6M32 48v6M10 32h6M48 32h6M16.5 16.5l4 4M43.5 43.5l4 4M16.5 47.5l4-4M43.5 20.5l4-4"/></g>';
function svg(inner){ return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>'; }
function icon(k){
  if(k==="sun") return svg(SUN);
  if(k==="part") return svg('<g transform="scale(.6)">'+SUN+'</g><g transform="translate(10,14) scale(.85)">'+CLOUD+'</g>');
  if(k==="cloud") return svg('<g transform="translate(0,6)">'+CLOUD+'</g>');
  if(k==="fog") return svg('<g stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 24h40M8 34h44M14 44h38"/></g>');
  if(k==="rain") return svg('<g transform="translate(0,-4)">'+CLOUD+'</g><g stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M22 46l-3 8M33 46l-3 8M44 46l-3 8"/></g>');
  if(k==="snow") return svg('<g transform="translate(0,-4)">'+CLOUD+'</g><g fill="currentColor"><circle cx="21" cy="50" r="2.5"/><circle cx="32" cy="54" r="2.5"/><circle cx="43" cy="50" r="2.5"/></g>');
  if(k==="storm") return svg('<g transform="translate(0,-4)">'+CLOUD+'</g><path d="M34 38l-7 11h8l-5 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>');
  return svg(CLOUD);
}
function hm(s){
  if (!s || s.length < 16) return "–";
  var H = +s.substr(11,2), M = s.substr(14,2);
  if (!CONFIG.hour12) return (H<10?"0":"")+H+":"+M;
  return ((H%12)||12) + ":" + M + (H<12 ? " AM" : " PM");
}
function wx(c){ return WX[c] || ["—","cloud"]; }

function loadWeather(){
  var u = "https://api.open-meteo.com/v1/forecast?latitude="+CONFIG.lat+"&longitude="+CONFIG.lon+
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&forecast_days=5"+
    "&temperature_unit="+CONFIG.units+"&wind_speed_unit=mph&timezone="+encodeURIComponent(CONFIG.timezone);
  var x = new XMLHttpRequest();
  x.open("GET", u); x.timeout = 15000;
  x.onload = function(){
    try {
      var d = JSON.parse(x.responseText), c = d.current, w = wx(c.weather_code);
      var deg = CONFIG.units === "fahrenheit" ? "°F" : "°C";
      $("wPlace").textContent = CONFIG.place;
      $("wIcon").innerHTML = icon(w[1]);
      $("wTemp").textContent = Math.round(c.temperature_2m) + "°";
      $("wDesc").textContent = w[0];
      $("wMeta").textContent = "Feels like " + Math.round(c.apparent_temperature) + deg;
      $("wWind").textContent = "Wind " + Math.round(c.wind_speed_10m) + " mph";
      var dd = d.daily;
      $("sHL").textContent = Math.round(dd.temperature_2m_max[0]) + "° / " + Math.round(dd.temperature_2m_min[0]) + "°";
      $("sPop").textContent = (dd.precipitation_probability_max && dd.precipitation_probability_max[0] != null) ? dd.precipitation_probability_max[0] + "%" : "–";
      $("sRise").textContent = hm(dd.sunrise && dd.sunrise[0]);
      $("sSet").textContent = hm(dd.sunset && dd.sunset[0]);
      var html = "";
      for (var i=0;i<d.daily.time.length;i++){
        var dt = new Date(d.daily.time[i] + "T12:00:00");
        var name = i===0 ? "Today" : dt.toLocaleDateString("en-US",{weekday:"short"});
        html += '<div class="day"><div class="d">'+name+'</div><div class="i">'+icon(wx(d.daily.weather_code[i])[1])+
          '</div><div class="t">'+Math.round(d.daily.temperature_2m_max[i])+'° <span>'+Math.round(d.daily.temperature_2m_min[i])+'°</span></div></div>';
      }
      $("days").innerHTML = html;
    } catch(e){ $("wDesc").textContent = "Weather unavailable"; }
  };
  x.onerror = x.ontimeout = function(){ $("wDesc").textContent = "Weather offline"; };
  x.send();
}
loadWeather(); setInterval(loadWeather, CONFIG.weatherRefreshMin*60*1000);

/* ---- TradingView widgets ---- */
function tv(containerId, scriptName, cfg){
  var box = document.createElement("div");
  box.className = "tradingview-widget-container";
  var inner = document.createElement("div");
  inner.className = "tradingview-widget-container__widget";
  box.appendChild(inner);
  var s = document.createElement("script");
  s.type = "text/javascript"; s.async = true;
  s.src = "https://s3.tradingview.com/external-embedding/embed-widget-" + scriptName + ".js";
  s.text = JSON.stringify(cfg);
  box.appendChild(s);
  $(containerId).appendChild(box);
}
tv("ticker", "ticker-tape", {
  symbols: CONFIG.tickers, colorTheme: "dark", isTransparent: true, displayMode: "adaptive", locale: "en"
});
tv("chart", "advanced-chart", {
  autosize: true, symbol: CONFIG.chartSymbol, interval: "D", timezone: CONFIG.timezone,
  theme: "dark", style: "2", locale: "en", hide_top_toolbar: true, hide_legend: false,
  hide_side_toolbar: true, allow_symbol_change: false, backgroundColor: "#131a26", gridColor: "rgba(0,0,0,0)"
});

/* ---- reload nightly to keep a long-running page fresh ---- */
setInterval(function(){ var n=new Date(); if(n.getHours()===4 && n.getMinutes()===0) location.reload(); }, 60000);

/* ---- remote: red button reloads ---- */
document.addEventListener("keydown", function(e){
  if (e.keyCode === 403 || e.key === "r") { location.reload(); }
});
</script>
</body>
</html>
